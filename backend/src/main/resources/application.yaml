spring:
  application:
    name: portal
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_portal
    username: postgres
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
server:
  port: 8080
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
  security:
    login-url: /auth/login
    allowed-urls: /auth/register,/auth/logout,/swagger-ui/**,/v3/api-docs/**
  storage:
    location: uploads