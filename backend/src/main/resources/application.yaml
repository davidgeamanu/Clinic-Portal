spring:
  application:
    name: portal
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_portal
    username: postgres
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
server:
  port: 8080
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  security:
    login-url:
    allowed-urls: