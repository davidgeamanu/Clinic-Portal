spring:
  application:
    name: portal
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_portal
    username: postgres
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Existing dev databases created by Hibernate ddl-auto get baselined at 0;
    # every migration is written to be idempotent against such schemas.
    baseline-on-migrate: true
    baseline-version: 0
logging:
  pattern:
    # Correlation id (from CorrelationIdFilter / OutboxRelay) next to the level
    level: "%5p [cid:%X{correlationId:-}]"
server:
  port: 8080
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
  security:
    login-url: /auth/login
    allowed-urls: /auth/register,/auth/logout,/swagger-ui/**,/v3/api-docs/**
  storage:
    location: uploads
  ai:
    # Optional: enables Claude-powered symptom triage; keyword fallback when empty
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  messaging:
    appointment-booked-queue: clinic.appointment-booked.queue
    appointment-status-changed-queue: clinic.appointment-status-changed.queue
    consultation-note-created-queue: clinic.consultation-note-created.queue