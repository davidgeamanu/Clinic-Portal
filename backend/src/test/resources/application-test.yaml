spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long-for-hmac
    expiration-minutes: 60
  security:
    login-url: /auth/login
    allowed-urls: /auth/register,/auth/logout
  storage:
    location: test-uploads
  messaging:
    appointment-booked-queue: test.appointment-booked.queue
    appointment-status-changed-queue: test.appointment-status-changed.queue
    consultation-note-created-queue: test.consultation-note-created.queue
