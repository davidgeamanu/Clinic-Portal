spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_notifications_db
    username: postgres
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Existing dev databases created by Hibernate ddl-auto get baselined at 0;
    # every migration is written to be idempotent against such schemas.
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Poison messages: retry in-memory, then reject (not requeue) so the
        # dead-letter exchange routes them to the DLQ.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
        default-requeue-rejected: false
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USERNAME:}
    password: ${MAILTRAP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  pattern:
    # Correlation id (propagated via RabbitMQ header / CorrelationIdFilter)
    level: "%5p [cid:%X{correlationId:-}]"
server:
  port: 8081
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET}
  email:
    from: noreply@clinicportal.local
    enabled: ${MAIL_ENABLED:false}
  messaging:
    appointment-booked-queue: clinic.appointment-booked.queue
    appointment-status-changed-queue: clinic.appointment-status-changed.queue
    consultation-note-created-queue: clinic.consultation-note-created.queue
    dead-letter-queue: clinic.notifications.dlq
