spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    # Tests run on H2 with create-drop; the Postgres migrations don't apply.
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long-for-hmac
  email:
    from: test@clinicportal.local
    enabled: false
  messaging:
    appointment-booked-queue: test.appointment-booked.queue
    appointment-status-changed-queue: test.appointment-status-changed.queue
    consultation-note-created-queue: test.consultation-note-created.queue
    dead-letter-queue: test.notifications.dlq
