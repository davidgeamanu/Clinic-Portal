server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A literal hostname in proxy_pass is resolved once at startup and cached
    # forever, so a rebuilt upstream's new IP would 502 until reload. Holding
    # them in variables defers lookup to request time; $request_uri is then
    # explicit because that form no longer forwards the path by itself.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Notification service (must match before the generic /api rule).
    # SSE needs buffering off and a long read timeout.
    location /api/notifications {
        set $notifications http://notification-service:8081;
        proxy_pass $notifications$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Clinic portal backend
    location /api {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $request_id;
        client_max_body_size 25m;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
